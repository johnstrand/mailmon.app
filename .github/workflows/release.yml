name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate next version
        id: version
        run: |
          @'
          const fs = require('node:fs')
          const { version } = require('./package.json')
          if (!/^\d+\.[0-9]\.\d+$/.test(version)) {
            throw new Error(`Expected major.minor.patch with a minor version from 0 to 9, got ${version}`)
          }
          const [major, minor] = version.split('.').map(Number)
          const next = minor === 9 ? `${major + 1}.0.0` : `${major}.${minor + 1}.0`
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`)
          '@ | node -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version $env:VERSION --no-git-tag-version --ignore-scripts

      - name: Save updated package versions
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --win --x64
            assets: dist/*-setup.exe
          - platform: macos
            os: macos-latest
            args: --mac dmg zip --universal
            assets: |
              dist/*.dmg
              dist/*.zip
          - platform: linux
            os: ubuntu-22.04
            args: --linux AppImage deb --x64
            assets: |
              dist/*.AppImage
              dist/*.deb
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Restore updated package versions
        uses: actions/download-artifact@v4
        with:
          name: release-version
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package application
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Save release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Restore updated package versions
        uses: actions/download-artifact@v4
        with:
          name: release-version
          path: .

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets

      - name: Verify release packages
        run: |
          $expected = @{
            windows = @('*-setup.exe')
            macos = @('*.dmg', '*.zip')
            linux = @('*.AppImage', '*.deb')
          }
          foreach ($platform in $expected.Keys) {
            foreach ($pattern in $expected[$platform]) {
              $files = @(Get-ChildItem -LiteralPath "release-assets/release-assets-$platform" -Filter $pattern -File)
              if ($files.Count -eq 0) {
                throw "Missing $platform release package: $pattern"
              }
            }
          }

      - name: Commit and tag the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: release v$env:VERSION" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" -- package.json package-lock.json &&
          git tag "v$env:VERSION" &&
          git push --atomic origin "HEAD:refs/heads/$env:RELEASE_BRANCH" "refs/tags/v$env:VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath release-assets -Recurse -File)
          gh release create "v$env:VERSION" --verify-tag --title "v$env:VERSION" --generate-notes @($packages.FullName)
