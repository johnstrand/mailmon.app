name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate next version
        id: version
        run: |
          @'
          const fs = require('node:fs')
          const { version } = require('./package.json')
          if (!/^\d+\.[0-9]\.\d+$/.test(version)) {
            throw new Error(`Expected major.minor.patch with a minor version from 0 to 9, got ${version}`)
          }
          const [major, minor] = version.split('.').map(Number)
          const next = minor === 9 ? `${major + 1}.0.0` : `${major}.${minor + 1}.0`
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`)
          '@ | node -

      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version $env:VERSION --no-git-tag-version --ignore-scripts

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: release v$env:VERSION" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" -- package.json package-lock.json &&
          git tag "v$env:VERSION" &&
          git push --atomic origin "HEAD:refs/heads/$env:RELEASE_BRANCH" "refs/tags/v$env:VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) {
            throw 'No Windows installer was produced.'
          }
          gh release create "v$env:VERSION" --verify-tag --title "v$env:VERSION" --generate-notes @($installers.FullName)
